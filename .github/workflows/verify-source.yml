name: Verify NJFU Login

on:
  workflow_dispatch:
    inputs:
      semester:
        description: Optional semester override, for example 2026-2027-1
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: njfu-login-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: Verify school data access without notifications
        env:
          JW_USERNAME: ${{ secrets.JW_USERNAME }}
          JW_PASSWORD: ${{ secrets.JW_PASSWORD }}
          JW_COOKIE: ${{ secrets.JW_COOKIE }}
          JW_SEMESTER: ${{ vars.JW_SEMESTER }}
          VERIFY_SEMESTER: ${{ inputs.semester }}
        run: python scripts/verify_source.py
